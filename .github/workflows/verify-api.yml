name: 线上 API 巡检

# 手动触发：gh workflow run verify-api.yml
# 用途：从 GitHub runner（境外网络）真实调用线上 Cloudflare Pages Functions，
#       验证 API Key 是否生效、业务链路是否通。
#       本机直连 *.pages.dev 在国内会被干扰，无法作为验证依据。
#
# 覆盖三层：
#   1. health          —— Key 是否注入（llm / asr / speechMode）
#   2. 写作批改        —— DeepSeek 链路 + 业务返回
#   3. 口语评分        —— 真实音频 -> 云端 ASR -> LLM 四维评分
#                          （仓库自带 2268 个教材音频，用其中一个做真实样本）

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'API 基址（留空用线上默认）'
        required: false
        default: 'https://ketzxt-api.pages.dev'

jobs:
  verify:
    name: 验证 health / 写作 / 口语
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（取真实教材音频做 ASR 样本）
        uses: actions/checkout@v4

      - name: 健康检查
        run: |
          BASE="${{ github.event.inputs.base }}"
          echo "base: $BASE"
          curl -sS -m 30 "$BASE/api/health" | tee /tmp/health.json
          echo ""
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/health.json'))
          print('llm(DeepSeek)  :', d.get('llm'))
          print('asr(SiliconFlow):', d.get('asr'))
          print('speechMode      :', d.get('speechMode'))
          assert d.get('llm') is True, 'DeepSeek key not injected'
          print('PASS: DeepSeek key injected')
          PY

      - name: 写作批改实测
        run: |
          BASE="${{ github.event.inputs.base }}"
          cat > /tmp/body.json <<'EOF'
          {
            "text": "Dear Teacher, I am sorry I am ill today, so I cannot come to school. I have a fever. Please could you tell me what homework I should do? Thank you. Best wishes, Ben",
            "prompt": "你生病了不能去上学。给老师写一封邮件（至少 25 词），说明情况，并问一个关于作业的问题。",
            "requirement": "3 个内容点：表达歉意 / 说清不能上学的原因 / 问作业",
            "kind": "email",
            "minWords": 25
          }
          EOF
          curl -sS -m 60 -X POST "$BASE/api/grade-writing" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/body.json | tee /tmp/grade.json
          echo ""
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/grade.json'))
          if not d.get('ok'):
              print('FAIL:', d.get('error')); raise SystemExit(1)
          print('PASS: 内容', d.get('contentScore'), '| 语言', d.get('languageScore'),
                '| 综合', d.get('overallScore'))
          for s in (d.get('suggestions') or [])[:3]:
              print('   ', s)
          PY

      - name: 口语评分实测（真实音频 -> 云端 ASR -> LLM）
        run: |
          BASE="${{ github.event.inputs.base }}"
          MP3=$(ls ket-app/public/audio/*.mp3 | head -1)
          echo "sample audio: $MP3"
          # 转成浏览器录音格式（webm/opus），与前端 MediaRecorder 输出一致
          ffmpeg -y -loglevel error -i "$MP3" -c:a libopus -b:a 32k -ar 16000 -ac 1 /tmp/sample.webm
          python3 - <<'PY'
          import base64, json
          b64 = base64.b64encode(open('/tmp/sample.webm','rb').read()).decode()
          json.dump({
              'audioBase64': b64,
              'mimeType': 'audio/webm',
              'question': 'What is the boy doing?',
              'keywords': ['boy', 'playing', 'football', 'park'],
          }, open('/tmp/speech.json','w'))
          print('request body ready, b64 chars:', len(b64))
          PY
          curl -sS -m 90 -X POST "$BASE/api/grade-speech" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/speech.json | tee /tmp/speech-res.json
          echo ""
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/speech-res.json'))
          if not d.get('ok'):
              print('FAIL:', d.get('error')); raise SystemExit(1)
          src = d.get('asrSource')
          print('PASS: asrSource =', src,
                '| 综合', d.get('score'),
                '| 内容', d.get('contentScore'),
                '| 语法', d.get('grammarScore'),
                '| 流利', d.get('fluencyScore'),
                '| 词汇', d.get('vocabularyScore'))
          print('   transcript:', d.get('transcript'))
          for g in (d.get('grammarIssues') or [])[:3]:
              print('   grammar:', g)
          if src != 'cloud-asr':
              print('WARN: fell back to browser transcript (cloud ASR key may be invalid)')
              raise SystemExit(2)
          print('PASS: cloud ASR is live')
          PY
