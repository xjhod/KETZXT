name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ 使用 Node 22（兼容 Vite 8 / TypeScript 6 / React 19）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ket-app/package-lock.json

      - name: Install dependencies
        run: cd ket-app && npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Write base path file
        run: printf '/KETZXT/\n' > ${{ runner.temp }}/base-path.txt

      # 用 build:cloud 而不是 npm run build —— 前者会：
      #   1) 读 BASE_PATH_FILE 指定的 base（绕开 shell 参数转换）
      #   2) 构建后校验产物资源路径，base 写错就直接以非 0 退出
      # base 写错会导致线上资源全 404，而 vite 构建日志里看不出来
      # （vite 会静默兜底），所以这道闸门是必须的。
      - name: Build
        run: cd ket-app && npm run build:cloud
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # ⚠️ 必须显式指定：仓库里的 base-path.txt 是 "/"（云服务域名用）。
          # build-cloud.mjs 优先读 BASE_PATH_FILE，否则退回 base-path.txt；
          # 不覆盖的话会构建出根路径产物，
          # 线上 https://xjhod.github.io/KETZXT/ 的资源全部 404。
          BASE_PATH_FILE: ${{ runner.temp }}/base-path.txt
          # LLM 后端地址（Cloudflare Pages Functions）。这是地址不是密钥，可安全注入。
          # 未配置 secret 时前端会走 /llm 同域路径 —— AI 批改自动降级为不可用，不影响做题。
          VITE_LLM_API_BASE: ${{ secrets.VITE_LLM_API_BASE }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ket-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
