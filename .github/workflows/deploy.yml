name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ 使用 Node 22（兼容 Vite 8 / TypeScript 6 / React 19）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ket-app/package-lock.json

      - name: Install dependencies
        run: cd ket-app && npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Build
        run: cd ket-app && npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # LLM 后端地址（Cloudflare Pages Functions）。这是地址不是密钥，可安全注入。
          # 未配置 secret 时前端会走 /llm 同域路径 —— AI 批改自动降级为不可用，不影响做题。
          VITE_LLM_API_BASE: ${{ secrets.VITE_LLM_API_BASE }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ket-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
